<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Desktop</title>
  <style>
    :root {
      --bg-base: #11111b;
      --bg-raised: #181825;
      --bg-surface: #1e1e2e;
      --bg-panel: rgba(17, 17, 27, 0.80);

      --border: #5c4110;
      --line: #313244;
      --line-soft: #45475a;

      --text: #cdd6f4;
      --text-dim: #a6adc8;
      --accent: #f9e2af;
      --accent-2: #fab387;
      --green: #a6e3a1;
      --blue: #89b4fa;
      --red: #f38ba8;

      --radius-panel: 28px;
      --radius-box: 12px;
      --radius-ctl: 8px;
      --gap: clamp(28px, 2.6vw, 56px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: transparent;
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      color: var(--text);
      font-family: system-ui, "Cantarell", "Noto Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ==================== TAPETA (osobny div z samym obrazkiem) ==================== */
    .wallpaper-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: var(--bg-base);
    }

    .wallpaper-layer .wallpaper {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ==================== MAŁY MONITOR ==================== */
    .screen-20 {
      position: relative;
      width: 100vw;   /* wypełnia okno, więc tapeta pokrywa cały ekran */
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
    }

    /* Siatka widżetów leży nad tapetą */
    .widgets {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: var(--gap);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 360px;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "terminal weather chat"
        "terminal weather command";
      gap: var(--gap);
    }

    /* Wspólny wygląd wszystkich paneli */
    #terminal-frame,
    #weatherDisplay,
    #command-output,
    #chatBot {
      border: 2px solid var(--border);
      border-radius: var(--radius-panel);
      background-color: var(--bg-panel);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      min-width: 0;
      min-height: 0;
    }

    /* ==================== DUŻY MONITOR (2K): SAMA TAPETA ====================
       Ten sam plik HTML działa na obu monitorach. Okno szersze niż 2200 px
       (2560x1440) pokazuje tylko obrazek, węższe (1920x1080) - widżety. */
    .screen-27 {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
    }

    @media (min-width: 2200px) {
      .screen-20 { display: none; }
      .screen-27 { display: block; }
    }

    /* ==================== TERMINAL ==================== */
    #terminal-frame {
      grid-area: terminal;
      width: 100%;
      height: 100%;
      padding: 12px;
      background-color: var(--bg-base);
      overflow: hidden;
    }

    /* ==================== PRZYCISKI I POLA (wspólne) ==================== */
    .btn-generate {
      background-color: var(--accent);
      color: var(--bg-base);
      border: none;
      border-radius: var(--radius-ctl);
      padding: 0 1.2rem;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-generate:hover {
      background-color: goldenrod;
      transform: translateY(-2px);
    }

    .btn-generate:active {
      transform: translateY(1px) scale(0.97);
    }

    :is(button, textarea, iframe):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==================== COMMANDS AI HELPER ==================== */
    #command-output {
      grid-area: command;
      justify-self: stretch;
      width: 100%;
      position: relative; /* dla toasta */
      padding: 1.1rem 1.3rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      overflow: hidden;
    }

    #command-output h2 {
      color: var(--accent);
      font-size: 1.15rem;
      text-align: center;
      text-shadow: 0 0 8px rgba(249, 226, 175, 0.4);
      text-decoration: underline 2px var(--accent-2);
      text-underline-offset: 5px;
    }

    #command-output h3 {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .command-row {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .command-row .btn-generate {
      height: 40px;
    }

    #prompt {
      width: 100%;
      height: 64px;
      background-color: var(--bg-base);
      border: 1px solid var(--line);
      border-radius: var(--radius-ctl);
      color: var(--text);
      padding: 0.5rem 0.7rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #prompt:focus {
      border-color: var(--accent);
      box-shadow: 0 0 6px rgba(249, 226, 175, 0.3);
    }

    .output-wrapper {
      position: relative;
    }

    #output {
      min-height: 48px;
      max-height: 96px;
      overflow: auto;
      padding: 0.7rem 3rem 0.7rem 0.9rem;
      background-color: var(--bg-base);
      border: 1px dashed var(--line-soft);
      border-radius: var(--radius-ctl);
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--green);
      text-shadow: 0 0 5px rgba(166, 227, 161, 0.35);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .btn-copy {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--line);
      color: var(--accent);
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-copy:hover {
      background: var(--line-soft);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    #toast {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--accent);
      color: var(--bg-base);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: bottom 0.3s ease-in-out, opacity 0.3s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }

    #toast.show {
      bottom: 12px;
      opacity: 1;
    }

    /* ==================== POGODA ==================== */
    #weatherDisplay {
      grid-area: weather;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #weatherDayChoose,
    #godzChoose {
      position: relative;
      flex: none;
      height: 76px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    #weatherDayChoose { border-bottom: 2px solid var(--border); }
    #godzChoose       { border-top: 2px solid var(--border); }

    .buttonWeatherChoose,
    .godzChooseBtn {
      display: grid;
      place-items: center;
      cursor: pointer;
      user-select: none;
    }

    .buttonWeatherChoose h1,
    .godzChooseBtn h1 {
      font-size: 1.5rem;
      color: var(--text-dim);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .buttonWeatherChoose.active h1,
    .godzChooseBtn.active h1 {
      color: var(--accent);
    }

    .buttonWeatherChoose:hover h1,
    .godzChooseBtn:hover h1 {
      transform: translateY(-4px);
    }

    .buttonWeatherChoose:active h1,
    .godzChooseBtn:active h1 {
      transform: translateY(0);
    }

    #buttonWC2, #btnGC2 {
      border-left: 2px solid var(--border);
      border-right: 2px solid var(--border);
    }

    #borderBottomDisplay,
    #borderTopDisplay {
      position: absolute;
      left: 0;
      width: calc(100% / 3);
      height: 2px;
      z-index: 2;
      background-color: var(--accent);
      box-shadow: 0 0 10px rgba(249, 226, 175, 0.6);
      transition: transform 0.3s ease-in-out;
    }

    #borderBottomDisplay { bottom: -2px; }
    #borderTopDisplay    { top: -2px; }

    #weatherDisplayReal {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .weather-card {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    .weather-header {
      font-size: 1.3rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .weather-header span {
      color: var(--accent);
      font-weight: bold;
    }

    .weather-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .weather-status .weather-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(249, 226, 175, 0.4);
      line-height: 1.15;
      text-wrap: balance;
    }

    .weather-status .weather-emoji {
      font-size: 2.6rem;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .weather-temp {
      font-size: 5.5rem;
      font-weight: bold;
      color: var(--green);
      line-height: 1;
      text-shadow: 0 0 20px rgba(166, 227, 161, 0.25);
    }

    .weather-temp-feels {
      display: block;
      margin-top: 0.6rem;
      font-size: 1.4rem;
      font-weight: normal;
      color: #bac2de;
    }

    .weather-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.3rem;
      width: 100%;
      max-width: 620px;
      padding: 1.6rem;
      background-color: var(--bg-raised);
      border: 1.5px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .weather-detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .weather-detail-item.style-full-width {
      grid-column: span 2;
    }

    .weather-detail-item .label {
      color: var(--blue);
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .weather-detail-item p {
      font-size: 1.35rem;
      font-weight: 500;
    }

    .weather-no-data {
      padding: 20px;
      color: var(--red);
      font-size: 1.4rem;
      text-align: center;
    }

    /* ==================== CZATBOT ==================== */
    #chatBot {
      grid-area: chat;
      position: relative; /* dla okienka modalnego */
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .chat-header h2 {
      color: var(--accent);
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(249, 226, 175, 0.4);
    }

    .chat-clear-btn {
      background: transparent;
      border: 1px solid var(--line-soft);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 3px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .chat-clear-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.05);
    }

    #chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    #chat-messages::-webkit-scrollbar { width: 5px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    @keyframes chatMessageIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseTyping {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes inputSendPulse {
      0%   { transform: scale(1); border-color: var(--border); }
      50%  { transform: scale(0.97); border-color: var(--green); box-shadow: 0 0 12px rgba(166, 227, 161, 0.4); }
      100% { transform: scale(1); border-color: var(--border); }
    }

    .chat-msg {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.4;
      max-width: 90%;
      word-break: break-word;
      animation: chatMessageIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .chat-msg.user {
      align-self: flex-end;
      background-color: #14141f;
      border: 1px solid var(--border);
      border-bottom-right-radius: 3px;
    }

    .chat-msg.assistant {
      align-self: flex-start;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .chat-msg.loading {
      animation: chatMessageIn 0.25s ease, pulseTyping 1.2s infinite ease-in-out;
      color: var(--text-dim);
      font-style: italic;
    }

    .chat-msg.error {
      align-self: center;
      width: 100%;
      max-width: 100%;
      text-align: center;
      font-size: 0.82rem;
      color: var(--red);
      background-color: rgba(243, 139, 168, 0.15);
      border: 1px solid var(--red);
      border-radius: 10px;
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #chat-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0.6rem 0.7rem;
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-ctl);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    #chat-input:focus {
      border-color: var(--accent);
      background-color: var(--bg-raised);
      box-shadow: 0 0 10px rgba(249, 226, 175, 0.25);
    }

    #chat-input.sending {
      animation: inputSendPulse 0.35s ease-in-out;
    }

    #chat-send-btn {
      flex: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-raised);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: var(--radius-ctl);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #chat-send-btn:hover {
      background-color: var(--line);
      border-color: var(--accent);
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(249, 226, 175, 0.25);
    }

    #chat-send-btn:active {
      transform: scale(0.95);
    }

    /* Modal "Nowy czat" */
    .modal-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      background-color: rgba(17, 17, 27, 0.85);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-box {
      width: 85%;
      padding: 18px;
      text-align: center;
      background-color: var(--bg-raised);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      animation: modalFadeIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .modal-box p {
      margin-bottom: 14px;
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .modal-btn {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .modal-btn.confirm {
      background-color: var(--accent);
      color: var(--bg-base);
    }

    .modal-btn.confirm:hover {
      background-color: goldenrod;
      transform: translateY(-2px);
    }

    .modal-btn.cancel {
      background-color: var(--line);
      color: var(--text);
      border: 1px solid var(--line-soft);
    }

    .modal-btn.cancel:hover {
      background-color: var(--line-soft);
      transform: translateY(-2px);
    }

    /* Bloki kodu w czacie */
    .code-block-wrapper {
      margin: 8px 0;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-ctl);
      font-family: monospace;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background-color: var(--bg-raised);
      border-bottom: 1px solid var(--line);
      font-size: 0.75rem;
    }

    .code-lang {
      color: var(--text-dim);
      font-weight: bold;
      text-transform: lowercase;
    }

    .code-copy-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background-color: var(--line);
      color: var(--accent);
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .code-copy-btn:hover {
      background-color: var(--line-soft);
      border-color: var(--accent);
      transform: scale(1.03);
    }

    .code-copy-btn.copied {
      color: var(--green);
      border-color: var(--green);
      background-color: var(--bg-surface);
    }

    .code-block-wrapper pre {
      padding: 10px;
      overflow-x: auto;
      background-color: var(--bg-base);
      color: var(--green);
      font-family: monospace;
      font-size: 0.82rem;
      white-space: pre;
    }

    .code-block-wrapper pre::-webkit-scrollbar { height: 4px; }
    .code-block-wrapper pre::-webkit-scrollbar-track { background: var(--bg-base); }
    .code-block-wrapper pre::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* =====================================================================
       LIQUID GLASS (styl Apple) - nadpisuje wygląd paneli powyżej
       ===================================================================== */
    :root {
      --glass-tint: rgba(22, 22, 36, 0.07);
      --glass-sheen: linear-gradient(135deg,
                       rgba(255, 255, 255, 0.10) 0%,
                       rgba(255, 255, 255, 0.02) 40%,
                       rgba(255, 255, 255, 0.00) 60%,
                       rgba(255, 255, 255, 0.06) 100%);
      --glass-blur: blur(7px) saturate(140%);
      --glass-edge: rgba(255, 255, 255, 0.22);
      --glass-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 1px 0 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(255, 255, 255, 0.10),
        inset 0 0 28px rgba(255, 255, 255, 0.04),
        0 16px 36px rgba(0, 0, 0, 0.22),
        0 2px 6px rgba(0, 0, 0, 0.14);

      /* dzięki temu wszystkie linie/obramowania stają się "szklane" */
      --border: rgba(255, 255, 255, 0.20);
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.24);
    }

    #terminal-glass { grid-area: terminal; height: 100%; }

    #terminal-glass,
    #weatherDisplay,
    #command-output,
    #chatBot {
      position: relative;
      border: 1px solid var(--glass-edge);
      border-radius: var(--radius-panel);
      background: var(--glass-sheen), var(--glass-tint);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
      min-width: 0;
      min-height: 0;
      isolation: isolate;
    }

    /* Odblask na krawędzi: jasny z lewej-góry i prawej-dołu, jak załamane światło */
    #terminal-glass::before,
    #weatherDisplay::before,
    #command-output::before,
    #chatBot::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(145deg,
                    rgba(255, 255, 255, 0.85) 0%,
                    rgba(255, 255, 255, 0.00) 28%,

<script>

async function sendPrompt() {
    const promptInput = document.getElementById("prompt");
    const outputDiv = document.getElementById("output");
    const promptText = promptInput.value.trim();

    if (!promptText) {
        return;
    }

    outputDiv.innerText = "Command generating...";

    try {
        const response = await fetch("http://localhost:1234/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "local-model",
                messages: [
                    {
                        role: "system",
                        content: "Zwróć WYŁĄCZNIE komendę terminala zamkniętą w bloku kodu markdown (```). Nie pisz żadnego innego tekstu, słów wstępu ani objaśnień. Pamiętaj o tym że jesteś na Fedora linux"
                    },
                    { role: "user", content: `Command for: ${promptText}` }
                ],
                temperature: 0.1
            })
        });

        const data = await response.json();
        const rawText = data.choices[0].message.content;

        const codeBlockRegex = /```[\w-]*\s*([\s\S]*?)```/g;
        const matches = [...rawText.matchAll(codeBlockRegex)];

        if (matches.length > 0) {
            outputDiv.innerText = matches.map(m => m[1].trim()).join("\n");
        } else {
            outputDiv.innerText = rawText.trim();
        }

    } catch (error) {
        // Wstawia gotową komendę w pole wyjściowe do natychmiastowego skopiowania
        outputDiv.innerText = "lms load qwen2.5-coder-7b-instruct";
        console.error("Błąd połączenia z LM Studio:", error);
    }
}

function copyCommand() {
    const outputText = document.getElementById("output").innerText;

    if (!outputText || outputText === "Waiting for input" || outputText === "Command generating...") {
        return;
    }

    navigator.clipboard.writeText(outputText).then(() => {
        showToast();
    }).catch(err => {
        console.error("Copy error:", err);
    });
}

function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}

function terminalFocus() {

    // Wymuś fokus na iframe po kliknięciu gdziekolwiek w oknie

// Pobiera prognozę z wttr.in w formacie JSON (czyste dane, bez ASCII-artu).
// Zwraca 9 wpisów: 3 dni x (poranek, południe, wieczór).
async function getWeather() {
    try {
        const response = await fetch('https://wttr.in/Warszawa?format=j1&lang=en');
        const json = await response.json();
        const SLOTY = ['900', '1200', '1800'];
        const STRZALKI = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];

        return json.weather.slice(0, 3).flatMap(dzien => {
            const d = new Date(dzien.date + 'T12:00:00');
            const data = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const dzienTygodnia = d.toLocaleDateString('en-US', { weekday: 'long' });

            return SLOTY.map(slot => {
                const h = dzien.hourly.find(x => x.time === slot) || dzien.hourly[0];
                const opis = (h.weatherDesc && h.weatherDesc[0] && h.weatherDesc[0].value) || '';
                return {
                    data,
                    dzienTygodnia,
                    godzina: slot,
                    stanPogody: opis,
                    temperatura: parseInt(h.tempC, 10),
                    temperaturaOdczuwalna: parseInt(h.FeelsLikeC, 10),
                    wiatr: {
                        kierunek: STRZALKI[Math.round(Number(h.winddirDegree) / 45) % 8],
                        predkoscKmH: h.windspeedKmph
                    },
                    widocznoscKm: parseFloat(h.visibility),
                    opadMm: parseFloat(h.precipMM)
                };
            });
        });
    } catch (error) {
        console.error('Błąd pobierania danych:', error);
        return [];
    }
}

    // Opis z JSON jest już czysty - tylko zbijamy spacje i dajemy wielką literę
    let czystyStan = (obj.stanPogody || 'No data')
      .replace(/\s+/g, ' ')

    czystyStan = czystyStan.charAt(0).toUpperCase() + czystyStan.slice(1);

    // Dobieranie emoji po bokach
    // Własna ikona mgły (emoji 🌫️ w wielu czcionkach wygląda jak biały kwadrat)
    const MIST_ICON = `<svg viewBox="0 0 64 64" width="1em" height="1em" fill="none" stroke="#dbe7f3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M18 34a8 8 0 0 1 0-16a13 13 0 0 1 24-2a9 9 0 0 1 4 18Z" fill="rgba(219,231,243,0.15)"/><path d="M10 44H54M18 53H46"/></svg>`;

    function getWeatherEmoji(stan) {
      const s = stan.toLowerCase();
      if (/burz|thunder/.test(s)) return '⛈️';
      if (/śnieg|śnież|zawiej|snow|sleet|blizzard/.test(s)) return '❄️';
      if (/deszcz|przelotn|opad|mżawk|rain|drizzle|shower/.test(s)) return '🌧️';
      if (/mgł|zamglen|fog|mist|haze|smoke/.test(s)) return MIST_ICON;
      if (/częściow|umiarkow|lekkie zachmurz|partly|patchy/.test(s)) return '⛅';
      if (/pochmurn|zachmurz|cloud|overcast/.test(s)) return '☁️';
      if (/słonecz|czyst|bezchmurn|sunny|clear/.test(s)) return '☀️';
      return '🌤️';
    }

    const emoji = getWeatherEmoji(czystyStan);
    const czystaData = (obj.data || '').replace(/[└┴┘├┤│─┬┼┌┐L───────┘]/g, '').trim();

    divDisplay.innerHTML = `
      <div class="weather-card">
        <div class="weather-header">
          ${obj.dzienTygodnia ? obj.dzienTygodnia.slice(0, 3) + ', ' : ''}${czystaData ? czystaData + ' &bull; ' : ''}<span>${czystaPoraDnia}</span>
        </div>

        <div class="weather-status">
          <span class="weather-emoji">${emoji}</span>
          <span class="weather-text">${czystyStan}</span>
          <span class="weather-emoji">${emoji}</span>
        </div>

        <div class="weather-temp">
          ${obj.temperatura !== null ? obj.temperatura + '°C' : '--'}
          <span class="weather-temp-feels">
            feels like: ${obj.temperaturaOdczuwalna !== null ? obj.temperaturaOdczuwalna + '°C' : '--'}
          </span>
        </div>

        <div class="weather-details-grid">
          <div class="weather-detail-item">
            <span class="label">Wind</span>
            <p>${obj.wiatr && obj.wiatr.kierunek ? obj.wiatr.kierunek : ''} ${obj.wiatr && obj.wiatr.predkoscKmH ? obj.wiatr.predkoscKmH + ' km/h' : 'n/a'}</p>
          </div>
          <div class="weather-detail-item">
            <span class="label">Precipitation</span>
            <p>${obj.opadMm !== null ? obj.opadMm + ' mm' : '0 mm'}</p>
          </div>
          <div class="weather-detail-item style-full-width">
            <span class="label">Visibility</span>
            <p>${obj.widocznoscKm !== null ? obj.widocznoscKm + ' km' : 'n/a'}</p>
          </div>
        </div>
      </div>
    `;
  }

  // Przesuwa podkreślenie i zaznacza aktywny przycisk
  function setActiveTab(buttons, indicator, index) {
    indicator.style.transform = `translateX(${index * 100}%)`;
    buttons.forEach((btn, i) => btn.classList.toggle("active", i === index));
  }

  let globalIndex1 = 0 // dzień
  let globalIndex2 = 0 // pora dnia

  // Automatyczny wybór pory dnia wg godziny w Warszawie:
  // 6 - 10: Poranek, 10 - 18: Południe, reszta: Wieczór
  const warsawHour = Number(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Warsaw',
    hour: 'numeric',
    hour12: false
  }).format(new Date()));

  if (warsawHour >= 6 && warsawHour < 10) {
    globalIndex2 = 0;
  } else if (warsawHour >= 10 && warsawHour < 18) {
    globalIndex2 = 1;
  } else {
    globalIndex2 = 2;
  }

  const dane = await getWeather();

  const btnsTime = document.querySelectorAll(".godzChooseBtn")
  const timeSpan = document.getElementById("borderTopDisplay")
  const btnsWeather = document.querySelectorAll(".buttonWeatherChoose");
  const weatherSpan = document.getElementById("borderBottomDisplay");

  function refresh() {
    displayWeather(globalIndex1 * 3 + globalIndex2)
  }

  btnsTime.forEach((elem, i) => {
    elem.addEventListener("click", () => {
      globalIndex2 = i;
      setActiveTab(btnsTime, timeSpan, i);
      refresh();
    })
  })

  btnsWeather.forEach((elem, i) => {
    elem.addEventListener("click", () => {
      globalIndex1 = i;
      setActiveTab(btnsWeather, weatherSpan, i);
      refresh();
    });
  })

  // Stan początkowy
  setActiveTab(btnsTime, timeSpan, globalIndex2);
  setActiveTab(btnsWeather, weatherSpan, globalIndex1);
  refresh();

  // Wypełnienie nazw dni
  for (let i = 0; i < 3; i++) {
    if (dane[i * 3]) {
      btnsWeather[i].innerHTML = `<h1>${dane[i * 3].dzienTygodnia}</h1>`
    }
  }
}

// Na 2K (sama tapeta) nie uruchamiamy terminala ani pogody
const imageOnlyQuery = window.matchMedia('(min-width: 2200px)');
let widgetsStarted = false;

function startWidgets() {
  if (widgetsStarted || imageOnlyQuery.matches) return;
  widgetsStarted = true;
  const frame = document.getElementById('terminal-frame');
  frame.src = frame.dataset.src;
  weatherDisplay();
}

startWidgets();
imageOnlyQuery.addEventListener('change', startWidgets);

</script>

<!--Chat bot script-->

<script>
const SYSTEM_PROMPT = "Jesteś pomocnym asystentem AI. Odpowiadaj w języku, w jakim do ciebie mówię. Działasz na Linuxie Fedora. Rozmawiasz z nastolatkiem, żartuj i pytaj. Używaj emotek. A jeśli chcesz, abym mógł coś skopiować, daj to pomiędzy ```";

// Historia czatu przesłana do LM Studio z domyślnym promptem systemowym
let chatHistory = [
  { role: "system", content: SYSTEM_PROMPT }
];

async function sendChatMessage() {
  const inputEl = document.getElementById("chat-input");
  const userText = inputEl.value.trim();

  if (!userText) return;

  inputEl.classList.add("sending");
  setTimeout(() => inputEl.classList.remove("sending"), 350);

  appendChatMessage("user", userText);
  chatHistory.push({ role: "user", content: userText });
  inputEl.value = "";

  const loadingId = appendChatMessage("assistant loading", "AI is typing...");

  try {
    const response = await fetch("http://localhost:1234/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "local-model",
        messages: chatHistory,
        temperature: 0.7
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP error: ${response.status}`);
    }

    const data = await response.json();

    if (data.choices && data.choices.length > 0 && data.choices[0].message) {
      const aiReply = data.choices[0].message.content;
      updateChatMessage(loadingId, aiReply, "assistant");
      chatHistory.push({ role: "assistant", content: aiReply });
    } else {
      throw new Error("No valid response from the model.");
    }

  } catch (error) {
    console.error("Błąd ChatBota:", error);

    updateChatMessage(
      loadingId,
      "⚠️ Error: no model loaded in LM Studio or no connection to the server (localhost:1234)!",
      "error"
    );

    // Usuwamy ostatnią wiadomość użytkownika z historii, aby nie powodować desynchronizacji
    chatHistory.pop();
  }
}

function appendChatMessage(roleClass, text) {
  const messagesEl = document.getElementById("chat-messages");
  const msgDiv = document.createElement("div");
  const msgId = "chat-msg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);

  msgDiv.id = msgId;
  msgDiv.className = `chat-msg ${roleClass}`;
  msgDiv.innerHTML = parseMarkdown(text);

  messagesEl.appendChild(msgDiv);

  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 10);

  return msgId;
}

function updateChatMessage(msgId, newText, newRoleClass) {
  const msgDiv = document.getElementById(msgId);
  if (msgDiv) {
    msgDiv.innerHTML = parseMarkdown(newText);
    msgDiv.className = `chat-msg ${newRoleClass}`;

    msgDiv.style.animation = 'none';
    msgDiv.offsetHeight; /* trigger reflow */
    msgDiv.style.animation = null;

    const messagesEl = document.getElementById("chat-messages");
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function handleChatKeyDown(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendChatMessage();
  }
}

/* OBSŁUGA OKIENKA MODALNEGO "NOWY CZAT" */
function openNewChatModal() {
  const modal = document.getElementById("chat-modal-overlay");
  if (modal) modal.classList.remove("hidden");
}

function closeNewChatModal() {
  const modal = document.getElementById("chat-modal-overlay");
  if (modal) modal.classList.add("hidden");
}

function confirmNewChat() {
  chatHistory = [
    { role: "system", content: SYSTEM_PROMPT }
  ];
  document.getElementById("chat-messages").innerHTML = "";
  closeNewChatModal();
}

// Funkcja parsująca bloki kodu ``` oraz zwykły tekst
function parseMarkdown(text) {
  if (!text) return "";

  // Bezpieczne konwertowanie znaków HTML (ochrona XSS)
  const escapeHtml = (str) =>
    str.replace(/&/g, "&amp;")
       .replace(/</g, "&lt;")
       .replace(/>/g, "&gt;")
       .replace(/"/g, "&quot;")
       .replace(/'/g, "&#039;");

  const codeBlockRegex = /```(\w*)\r?\n?([\s\S]*?)```/g;

  let lastIndex = 0;
  let resultHTML = "";
  let match;

  while ((match = codeBlockRegex.exec(text)) !== null) {
    const textBefore = text.slice(lastIndex, match.index);
    resultHTML += escapeHtml(textBefore).replace(/\n/g, "<br>");

    const lang = match[1] ? escapeHtml(match[1]) : "code";
    const codeText = match[2].trim();

    resultHTML += `
      <div class="code-block-wrapper">
        <div class="code-header">
          <span class="code-lang">${lang}</span>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">📋 Copy</button>
        </div>
        <pre><code>${escapeHtml(codeText)}</code></pre>
      </div>
    `;

    lastIndex = match.index + match[0].length;
  }

  const textAfter = text.slice(lastIndex);
  resultHTML += escapeHtml(textAfter).replace(/\n/g, "<br>");

  return resultHTML;
}

// Kopiowanie zawartości bloku kodu do schowka
function copyCodeBlock(button) {
  const wrapper = button.closest('.code-block-wrapper');
  const code = wrapper.querySelector('code').innerText;

  navigator.clipboard.writeText(code).then(() => {
    const originalText = button.innerHTML;
    button.innerHTML = "✓ Copied!";
    button.classList.add("copied");

    setTimeout(() => {
      button.innerHTML = originalText;
      button.classList.remove("copied");
    }, 2000);
  }).catch(err => {
    console.error("Błąd kopiowania kodu:", err);
  });
}

</script>

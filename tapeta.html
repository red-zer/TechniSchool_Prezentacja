<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
      * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background-color: transparent;
}

body {
  width: 4160px;
  height: 1440px;
  display: flex;
  overflow: hidden;
  background-color: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

/* Monitor 20 cali (po lewej, wyśrodkowany pionowo) */
.screen-20 {
  width: 1920px;
  height: 1080px;
  margin-top: 0px;
  margin-bottom: auto;
  background-color: #11111b;
  color: #ffffff;
  padding: 2rem;
  display: flex;
}

@media (width = 2560px) {
  .screen-27 {
    width: 2560px;
    height: 1440px;
    background-color: #1e1e2e;
    color: #ffffff;
    padding: 2rem;
    padding-top: 4rem;
    z-index: 999;
    margin-left: -1920px;
  }
}

#command-output, #voiceGenerate {
  position: absolute; /* Potrzebne do pozycjonowania toasta */
  padding: 1rem;
  width: 340px;
  background-color: #181825;
  border: 2px solid #5c4110;
  color: #cdd6f4;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  align-items: stretch;
  transform: translateY(0);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  overflow: hidden;
  height: 230px;
  border-radius: 30px;
  bottom: 50px;
}

#command-output {
  left: 80px;
}

#voiceGenerate {
  left: 480px;
}

#command-output h2, #voiceGenerate h2 {
  color: #f9e2af;
  font-size: 1.2rem;
  text-align: center;
  margin: 0;
  text-shadow: 0 0 8px rgba(249, 226, 175, 0.4);
  text-decoration: underline decorative #fab387 2px;
  text-underline-offset: 4px;
}

#command-output h3 {
  color: #a6adc8;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 0.25rem;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}

#prompt, #textInput {
  width: 100%;
  height: 55px;
  background-color: #11111b;
  border: 1px solid #313244;
  border-radius: 6px;
  color: #cdd6f4;
  padding: 0.4rem 0.6rem;
  font-family: monospace;
  font-size: 0.85rem;
  resize: none;
  outline: none;
  transition: all 0.2s ease;
}

#prompt:focus {
  border-color: #f9e2af;
  transform: scale(1.01);
  box-shadow: 0 0 6px rgba(249, 226, 175, 0.3);
}

#command-output button.btn-generate, #voiceGenerate button.btn-generate {
  background-color: #f9e2af;
  color: #11111b;
  border: none;
  border-radius: 6px;
  padding: 0.4rem 0.8rem;
  font-weight: bold;
  font-size: 0.85rem;
  cursor: pointer;
  text-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
  transition: all 0.2s ease;
}

#command-output button.btn-generate:hover, #voiceGenerate button.btn-generate:hover {
  background-color: goldenrod;
  transform: translateY(-2px);
}

#command-output button.btn-generate:active, #voiceGenerate button.btn-generate:active {
  transform: translateY(1px) scale(0.97);
}

/* KONTENER NA WYNIK + PRZYCISK KOPIOWANIA */
.output-wrapper {
  position: relative;
}

/* POPRAWIONA SEKCJA DLA OUTPUT-WRAPPER-CONT */
#output-wrapper-cont {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  gap: 10px;
  margin-top: 0.5rem;
}

#output-wrapperIn1, 
#output-wrapperIn2 {
  flex: 1; /* Obaj chłopcy mają po równo 50% szerokości */
  display: flex;
  justify-content: center;
  align-items: center;
}

#outputVoice, #playVoiceBtn {
  width: 100%;
  background-color: #11111b;
  border: 1px dashed #45475a;
  border-radius: 6px;
  padding: 0.5rem;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 45px;
  cursor: pointer;
  transition: transform 100ms ease, border-color 0.2s ease;
}

#output, #outputVoice {
  font-family: monospace;
  font-size: 0.8rem;
  color: #a6e3a1;
  text-shadow: 0 0 5px rgba(166, 227, 161, 0.4);
}

#output {
  padding-right: 2.2rem; /* Miejsce na przycisk kopiowania */
  white-space: pre-wrap;
  word-break: break-all;
}

#outputVoice:hover, #playVoiceBtn:hover {
  transform: translateY(-2px);
  border-color: #f9e2af;
}

#outputVoice:active, #playVoiceBtn:active {
  transform: translateY(0px);
}

.btn-copy {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #313244;
  color: #f9e2af;
  border: 1px solid #45475a;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-copy:hover {
  background: #45475a;
  border-color: #f9e2af;
  transform: scale(1.05);
}

/* TOAST POWIADOMIENIE */
#toast {
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #f9e2af;
  color: #11111b;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  transition: bottom 0.3s ease-in-out, opacity 0.3s ease-in-out;
  opacity: 0;
  pointer-events: none;
}

#toast.show {
  bottom: 10px;
  opacity: 1;
}

/* OBSŁUGA OBRAZKÓW */
img {
  max-height: 24px; /* Domyślna wysokość zamiast 0px */
  width: auto;
  filter: invert(74%) sepia(58%) saturate(950%) hue-rotate(358deg) brightness(100%) contrast(100%);
}
#textInputBox {
  width: 100%;
}
#textInput {
  width: 70%;
}
#voiceInput {
  height: 55px;
  width: 18%;
  margin-left: 2%;
  background-color: gold;
  background-color: #11111b;
  border: 1px solid #313244;
  border-radius: 6px;
  color: #cdd6f4;
  padding: 0.4rem 0.6rem;
  font-family: monospace;
  font-size: 0.85rem;
  resize: none;
  outline: none;
  transition: all 0.2s ease;
  margin-top: -55px;
  position: absolute;
  top: 102px;
}
.infoVoice {
  color: #f9e2af;
  display: none;
}
#terminal-frame {
  border: 2px solid #5c4110;
  border-radius: 30px;
  padding: 15px;
  height: 61vh;
  width: calc(340px + 400px);
  margin: 0;
  margin-top: 2.5vw;
  margin-left: 2.5vw;
  overflow: auto;
  overflow-x: none;
  background-color: #11111b;
}
#weatherDisplay {
  border: 2px solid #5c4110;
  border-radius: 30px;
  padding: 15px;
  height: 88vh;
  width: 33vw;
  margin: 0;
  margin-top: 2.5vw;
  margin-left: 2.5vw;
  background-color: #11111b;
  position: relative;
}

#weatherDayChoose {
  height: calc(8vh - 15px);
  width: calc(100% + 30px);
  display: flex;
  position: relative;
  border-bottom: 2px solid #5c4110;
  margin-top: -30px;
  margin-left: -15px;
  margin-top: -15px;
}

.buttonWeatherChoose {
  height: 100%;
  width: calc(100% / 3);
  padding: 15px;
  padding-bottom: 0px;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-weight: bold;
}

.buttonWeatherChoose>h1, .buttonGodzrChoose>h1 {
  transition: 200ms;
}

#buttonWC2 , #btnGC2{
  border-right: 2px solid #5c4110;
  border-left: 2px solid #5c4110;
}

.buttonWeatherChoose:hover h1 {
  transform: translateY(-10px);
}

.buttonWeatherChoose:active h1 {
  transform: translateY(0px);
}

#borderBottomDisplay, #borderTopDisplay {
  display: block;
  width: calc(100% / 3);
  position: absolute;
  height: 2px;
  top: 0;
  left: 0;
  z-index: 999;
  background-color: #f9e2af;
  transition: left 0.3s ease-in-out;
}
#borderTopDisplay {
  top: -2px;
}

#godzChoose {
  width: 100%;
  height: 8vh;
  position: absolute;
  bottom: 0;
  left: 0;
  border-top: 2px solid #5c4110;
  display: flex;
}

.godzChooseBtn {
  width: calc(100% / 3);
  height: 100%;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.godzChooseBtn>h1 {
  transition: 200ms;
}

.godzChooseBtn:hover h1 {
  transform: translateY(-10px);
}

.godzChooseBtn:active h1 {
  transform: translateY(0px);
}

#weatherDisplayReal {
  width: calc(100% + 30px);
  margin-left: -15px;
  height: calc(100% - 12vh);
  z-index: 899;
}

/* Stylizacja kontenera pogody i zapobieganie ucinaniu tekstu */
#weatherDisplayReal {
  width: calc(100% + 30px);
  margin-left: -15px;
  height: calc(100% - 12vh);
  z-index: 899;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.weather-card {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  align-items: center;
  padding: 2.5rem 3rem;
  color: #cdd6f4;
  font-family: inherit;
  text-align: center;
  box-sizing: border-box;
}

.weather-header {
  font-size: 1.6rem;
  color: #a6adc8;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.weather-header span {
  color: #f9e2af;
  font-weight: bold;
}

.weather-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
  max-width: 98%;
  padding: 0 10px;
  box-sizing: border-box;
}
.weather-status .weather-text {
  font-size: clamp(1.6rem, 2.5vw, 2.6rem);
  font-weight: bold;
  color: #f9e2af;
  text-shadow: 0 0 15px rgba(249, 226, 175, 0.4);
  line-height: 1.1;
  text-align: center;
  white-space: nowrap; /* Zapobiega przechodzeniu tekstu do nowej linii */
}

.weather-status .weather-emoji {
  font-size: clamp(2rem, 3vw, 3rem);
  flex-shrink: 0; /* Uniemożliwia spadek emoji pod tekst */
  display: inline-block;
}

.weather-temp {
  font-size: 5.5rem;
  font-weight: bold;
  color: #a6e3a1;
  line-height: 1;
  text-shadow: 0 0 20px rgba(166, 227, 161, 0.2);
}

.weather-temp-feels {
  font-size: 1.6rem;
  color: #bac2de;
  font-weight: normal;
  display: block;
  margin-top: 0.5rem;
}

.weather-details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  width: 100%;
  max-width: 650px;
  background-color: #181825;
  padding: 1.8rem;
  border-radius: 16px;
  border: 1.5px solid #313244;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.weather-detail-item {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.weather-detail-item.style-full-width {
  grid-column: span 2;
}

.weather-detail-item .label {
  color: #89b4fa;
  font-weight: bold;
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.weather-detail-item p {
  font-size: 1.4rem;
  color: #cdd6f4;
  font-weight: 500;
}

.weather-no-data {
  padding: 20px;
  color: #f38ba8;
  font-size: 1.5rem;
  text-align: center;
}

video {
  width: 2560px;
  height: 1440px;
  position: fixed;
  top: 0;
  left: 0;
}

#chatBot {
  height: 90vh;
  margin-top: 2.5vw;
  margin-left: 2.5vw;
  margin-right: 2,5vw;
  width: 320px;
  border: 2px solid #5c4110;
  border-radius: 30px;
}

#screen-27{
  --x: calc(var(--posX, 0) * 1px);
  --y: calc(var(--posY, 0) * 1px);
  background-image: 
    linear-gradient(115deg, rgb(211 255 215), rgb(0 0 0)), 
    radial-gradient( 90% 100% at calc( 50% + var(--x)) calc( 0% + var(--y)), rgb(200 200 200), rgb(022 000 045)), 
    radial-gradient(100% 100% at calc( 80% - var(--x)) calc( 0% - var(--y)), rgb(250 255 000), rgb(036 000 000)), 
    radial-gradient(150% 210% at calc(100% + var(--x)) calc( 0% + var(--y)), rgb(020 175 125), rgb(000 010 255)), 
    radial-gradient(100% 100% at calc(100% - var(--x)) calc(30% - var(--y)), rgb(255 077 000), rgb(000 200 255)), 
    linear-gradient(60deg, rgb(255 000 000), rgb(120 086 255));
  background-blend-mode: overlay, overlay, difference, difference, difference, normal;
}


/* ==================== CZATBOT STYLES ==================== */
#chatBot {
  position: relative; /* Wymagane do pozycjonowania okienka modalnego */
  height: 90vh;
  margin-top: 2.5vw;
  margin-left: 2vw;
  margin-right: 2vw;
  width: calc(320px + 1vw);
  border: 2px solid #5c4110;
  border-radius: 30px;
  background-color: #11111b;
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 12px;
  overflow: hidden;
}

.chat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #5c4110;
  padding-bottom: 8px;
}

.chat-header h2 {
  color: #f9e2af;
  font-size: 1.1rem;
  margin: 0;
  text-shadow: 0 0 8px rgba(249, 226, 175, 0.4);
}

.chat-clear-btn {
  background: transparent;
  border: 1px solid #45475a;
  color: #a6adc8;
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 0.75rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.chat-clear-btn:hover {
  border-color: #f9e2af;
  color: #f9e2af;
  transform: scale(1.05);
}

#chat-messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
  scroll-behavior: smooth;
}

/* Scrollbar */
#chat-messages::-webkit-scrollbar {
  width: 5px;
}
#chat-messages::-webkit-scrollbar-track {
  background: #11111b;
}
#chat-messages::-webkit-scrollbar-thumb {
  background: #313244;
  border-radius: 3px;
}

/* ANIMACJE */
@keyframes chatMessageIn {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes pulseTyping {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

@keyframes modalFadeIn {
  0% {
    opacity: 0;
    transform: scale(0.9);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.chat-msg {
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 0.85rem;
  line-height: 1.35;
  max-width: 88%;
  word-break: break-word;
  white-space: pre-wrap;
  animation: chatMessageIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

/* Wiadomość użytkownika (ciemniejsze tło + ten sam border co AI) */
.chat-msg.user {
  align-self: flex-end;
  background-color: #14141f;
  color: #cdd6f4;
  border: 1px solid #5c4110;
  border-bottom-right-radius: 2px;
}

/* Odpowiedź AI (delikatnie jaśniejsze tło) */
.chat-msg.assistant {
  align-self: flex-start;
  background-color: #1e1e2e;
  color: #cdd6f4;
  border: 1px solid #5c4110;
  border-bottom-left-radius: 2px;
}

/* Stan ładowania */
.chat-msg.loading {
  animation: chatMessageIn 0.25s ease, pulseTyping 1.2s infinite ease-in-out;
  color: #a6adc8;
  font-style: italic;
}

/* Błąd */
.chat-msg.error {
  align-self: center;
  background-color: rgba(243, 139, 168, 0.15);
  color: #f38ba8;
  border: 1px solid #f38ba8;
  text-align: center;
  font-size: 0.8rem;
  width: 100%;
  border-radius: 10px;
}

/* UKŁAD POLE TEKSTOWE + PRZYCISK STRZAŁKI */
.chat-input-area {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

/* Pole tekstowe z obramowaniem pasującym do reszty ramek */
#chat-input {
  flex: 1;
  height: 42px;
  background-color: #11111b;
  border: 1px solid #5c4110; /* Kolor spójny z resztą ramek */
  border-radius: 8px;
  color: #cdd6f4;
  padding: 0.5rem;
  font-family: inherit;
  font-size: 0.85rem;
  resize: none;
  outline: none;
  transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}

/* Delikatne rozjaśnienie tła i obramowania na :focus */
#chat-input:focus {
  border-color: #f9e2af;
  background-color: #181825; /* Delikatnie jaśniejsze tło */
  box-shadow: 0 0 10px rgba(249, 226, 175, 0.25);
}

/* Animacja impulsu podczas wysyłania */
@keyframes inputSendPulse {
  0% {
    transform: scale(1);
    border-color: #5c4110;
  }
  50% {
    transform: scale(0.97);
    border-color: #a6e3a1; /* Błysk akcentujący wysłanie */
    box-shadow: 0 0 12px rgba(166, 227, 161, 0.4);
  }
  100% {
    transform: scale(1);
    border-color: #5c4110;
  }
}

/* Klasa aktywująca animację */
#chat-input.sending {
  animation: inputSendPulse 0.35s ease-in-out;
}

/* Ciemny przycisk ze strzałką po prawej */
#chat-send-btn {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  background-color: #181825;
  color: #f9e2af;
  border: 1px solid #5c4110;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

#chat-send-btn:hover {
  background-color: #313244;
  border-color: #f9e2af;
  transform: scale(1.05);
  box-shadow: 0 0 8px rgba(249, 226, 175, 0.25);
}

#chat-send-btn:active {
  transform: scale(0.95);
}

/* OKIENKO MODALNE (POTWIERDZENIE NOWEGO CZATU) */
.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(17, 17, 27, 0.85);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 1;
  transition: opacity 0.2s ease;
}

.modal-overlay.hidden {
  display: none;
  opacity: 0;
  pointer-events: none;
}

.modal-box {
  background-color: #181825;
  border: 2px solid #5c4110;
  border-radius: 16px;
  padding: 16px;
  width: 85%;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  animation: modalFadeIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.modal-box p {
  color: #cdd6f4;
  font-size: 0.85rem;
  margin-bottom: 14px;
  line-height: 1.3;
}

.modal-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.modal-btn {
  padding: 6px 16px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
}

.modal-btn.confirm {
  background-color: #f9e2af;
  color: #11111b;
}

.modal-btn.confirm:hover {
  background-color: goldenrod;
  transform: translateY(-2px);
}

.modal-btn.cancel {
  background-color: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
}

.modal-btn.cancel:hover {
  background-color: #45475a;
  transform: translateY(-2px);
}


/* ==================== BLOKI KODU W CZACIE ==================== */
.code-block-wrapper {
  margin: 8px 0;
  background-color: #11111b;
  border: 1px solid #45475a;
  border-radius: 8px;
  overflow: hidden;
  font-family: monospace;
  width: 100%;
}

.code-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #181825;
  padding: 4px 10px;
  border-bottom: 1px solid #313244;
  font-size: 0.75rem;
}

.code-lang {
  color: #a6adc8;
  font-weight: bold;
  text-transform: lowercase;
}

.code-copy-btn {
  background-color: #313244;
  color: #f9e2af;
  border: 1px solid #45475a;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 4px;
}

.code-copy-btn:hover {
  background-color: #45475a;
  border-color: #f9e2af;
  transform: scale(1.03);
}

async function sendPrompt() {
    const promptInput = document.getElementById("prompt");
    const outputDiv = document.getElementById("output");
    const promptText = promptInput.value.trim();

    if (!promptText) {
        return;
    }

    outputDiv.innerText = "Command generating...";

    try {
        const response = await fetch("http://localhost:1234/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "local-model",
                messages: [
                    { 
                        role: "system", 
                        content: "Zwróć WYŁĄCZNIE komendę terminala zamkniętą w bloku kodu markdown (```). Nie pisz żadnego innego tekstu, słów wstępu ani objaśnień. Pamiętaj o tym że jesteś na Fedora linux" 
                    },
                    { role: "user", content: `Command for: ${promptText}` }
                ],
                temperature: 0.1
            })
        });

        const data = await response.json();
        const rawText = data.choices[0].message.content;

        const codeBlockRegex = /```[\w-]*\s*([\s\S]*?)```/g;
        const matches = [...rawText.matchAll(codeBlockRegex)];

        if (matches.length > 0) {
            const extractedCommands = matches.map(m => m[1].trim()).join("\n");
            outputDiv.innerText = extractedCommands;
        } else {
            outputDiv.innerText = rawText.trim();
        }

    } catch (error) {
        // Wstawia gotową komendę w pole wyjściowe do natychmiastowego skopiowania
        outputDiv.innerText = "lms load qwen2.5-coder-7b-instruct";
        console.error("Błąd połączenia z LM Studio:", error);
    }
}

  try {

    return parsujPogodeHTML(data);
  } catch (error) {

    const errElem = document.getElementById('pogoda') || document.getElementById('weatherDisplay');
    if (errElem) errElem.textContent = 'Nie udało się pobrać danych.';
    return [];
  }
}

function parsujPogodeHTML(htmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    const container = doc.querySelector('.term-container');
    
    if (!container) return [];

    const lines = container.textContent.split('\n');
    const listaPrognoz = [];

    let wTabeli = false;
    let kolumnyDnia = [];
    let aktualnaDataHeader = '';
    let dzienIndex = 0;
    const dzisiaj = new Date();

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // 1. Wyciąganie daty z ramki ASCII nagłówka (np. "┤  pon 28 wrz ├")
        const matchData = line.match(/┤\s*([^├]+)\s*├/);
        if (matchData) {
            aktualnaDataHeader = matchData[1].trim();
        }

        // 2. Wykrywanie wiersza nagłówkowego pór dnia (Ranek, Dzień, Wieczór, Noc)
        if (line.includes('│') && (line.includes('Ranek') || line.includes('Rano') || line.includes('Dzień') || line.includes('Południe') || line.includes('Wieczór') || line.includes('Noc') || line.includes('00:'))) {
            wTabeli = true;

            // Wyznaczanie daty z nagłówka lub obliczanie kolejnego dnia
            let dataDnia = aktualnaDataHeader;
            if (!dataDnia) {
                const d = new Date(dzisiaj);
                d.setDate(dzisiaj.getDate() + dzienIndex);
                dataDnia = d.toLocaleDateString('pl-PL');
            }

            const naglowki = line.split('│').slice(1, -1).map(c => c.trim());

            kolumnyDnia = naglowki.map(pora => ({
                data: dataDnia,
                godzina: pora, // np. "Ranek", "Dzień", "Wieczór", "Noc"
                stanPogody: '',
                temperatura: null,
                temperaturaOdczuwalna: null,
                wiatr: { kierunek: null, predkoscKmH: null },
                widocznoscKm: null,
                opadMm: null
            }));

            dzienIndex++;
            aktualnaDataHeader = '';
            continue;
        }

        // 3. Przetwarzanie zawartości komórek tabeli
        if (wTabeli) {
            // Dolna krawędź ramki ASCII -> koniec sekcji danego dnia
            if (line.includes('└') || line.includes('┴') || line.includes('┘')) {
                wTabeli = false;
                kolumnyDnia.forEach(k => {
                    k.stanPogody = k.stanPogody.replace(/[\/\\()\-._―]/g, '').trim();
                    listaPrognoz.push(k);
                });
                kolumnyDnia = [];
                continue;
            }

            if (line.includes('│')) {
                const komorki = line.split('│').slice(1, -1).map(c => c.trim());

                komorki.forEach((tekstKomorki, idx) => {
                    if (!kolumnyDnia[idx]) return;

                    // a) Wiatr i kierunek (obsługuje zakresy np. "↖ 11-23 km/h" oraz "← 10 km/h")
                    const wiatrMatch = tekstKomorki.match(/([←→↑↓↖↗↘↙])\s*([\d\-]+)\s*km\/h/);
                    if (wiatrMatch) {
                        kolumnyDnia[idx].wiatr = {
                            kierunek: wiatrMatch[1],
                            predkoscKmH: wiatrMatch[2] // np. "11-23" lub "13"
                        };
                        return;
                    }

                    // b) Temperatura (obsługuje "14 °C" oraz "+14(13) °C")
                    const tempMatch = tekstKomorki.match(/([+-]?\d+)(?:\(([+-]?\d+)\))?\s*°C/);
                    if (tempMatch) {
                        const t = parseInt(tempMatch[1], 10);
                        kolumnyDnia[idx].temperatura = t;
                        kolumnyDnia[idx].temperaturaOdczuwalna = tempMatch[2] ? parseInt(tempMatch[2], 10) : t;
                        return;
                    }

                    // c) Widoczność (np. "10 km")
                    const widocznoscMatch = tekstKomorki.match(/(\d+(?:\.\d+)?)\s*km(?!\/h)/);
                    if (widocznoscMatch) {
                        kolumnyDnia[idx].widocznoscKm = parseFloat(widocznoscMatch[1]);
                        return;
                    }

                    // d) Opady (np. "0.0 mm | 3%")
                    const opadMatch = tekstKomorki.match(/(\d+(?:\.\d+)?)\s*mm/);
                    if (opadMatch) {
                        kolumnyDnia[idx].opadMm = parseFloat(opadMatch[1]);
                        return;
                    }

                    // e) Opis stanu pogody
                    if (/[a-zA-ZĄĆĘŁŃÓŚŹŻąćęłńóśźż]{3,}/.test(tekstKomorki) && 
                        !tekstKomorki.includes('km/h') && 
                        !tekstKomorki.includes('°C') && 
                        !tekstKomorki.includes('mm') && 
                        !tekstKomorki.includes('km')) {
                        
                        const opisCzysty = tekstKomorki.replace(/[\/\\()\-._―]/g, '').trim();
                        if (opisCzysty) {
                            if (kolumnyDnia[idx].stanPogody) {
                                kolumnyDnia[idx].stanPogody += ' ' + opisCzysty;
                            } else {
                                kolumnyDnia[idx].stanPogody = opisCzysty;
                            }
                        }
                    }
                });
            }
        }
    }

    return listaPrognoz;
}

      return '🌤️';
    }

    const emoji = getWeatherEmoji(czystyStan);
    const czystaData = (obj.data || '').replace(/[└┴┘├┤│─┬┼┌┐L───────┘]/g, '').trim();

    divDisplay.innerHTML = `
      <div class="weather-card">
        <div class="weather-header">
          ${czystaData ? czystaData + ' &bull; ' : ''}<span>${czystaPoraDnia}</span>
        </div>
        
        <div class="weather-status">
          <span class="weather-emoji">${emoji}</span>
          <span class="weather-text">${czystyStan}</span>
          <span class="weather-emoji">${emoji}</span>
        </div>

        <div class="weather-temp">
          ${obj.temperatura !== null ? obj.temperatura + '°C' : '--'}
          <span class="weather-temp-feels">
            odczuwalna: ${obj.temperaturaOdczuwalna !== null ? obj.temperaturaOdczuwalna + '°C' : '--'}
          </span>
        </div>

        <div class="weather-details-grid">
          <div class="weather-detail-item">
            <span class="label">Wiatr</span>
            <p>${obj.wiatr && obj.wiatr.kierunek ? obj.wiatr.kierunek : ''} ${obj.wiatr && obj.wiatr.predkoscKmH ? obj.wiatr.predkoscKmH + ' km/h' : 'b/d'}</p>
          </div>
          <div class="weather-detail-item">
            <span class="label">Opady</span>
            <p>${obj.opadMm !== null ? obj.opadMm + ' mm' : '0 mm'}</p>
          </div>
          <div class="weather-detail-item style-full-width">
            <span class="label">Widoczność</span>
            <p>${obj.widocznoscKm !== null ? obj.widocznoscKm + ' km' : 'b/d'}</p>
          </div>
        </div>
      </div>
    `;
  }

  // Zmienne główne
  let curWeather = 0
  let globalIndex1 = 0
  let globalIndex2 = 0

  // Obliczenie aktualnej godziny w Warszawie
  const warsawHour = Number(new Intl.DateTimeFormat('pl-PL', {
    timeZone: 'Europe/Warsaw',
    hour: 'numeric',
    hour12: false
  }).format(new Date()));

  // Automatyczny wybór pory dnia na podstawie godziny:
  // 6 - 10: Poranek (0)
  // 10 - 18: Południe (1)
  // 18 - 6: Wieczór (2)
  if (warsawHour >= 6 && warsawHour < 10) {
    globalIndex2 = 0;
  } else if (warsawHour >= 10 && warsawHour < 18) {
    globalIndex2 = 1;
  } else {
    globalIndex2 = 2;
  }

  // Pobranie danych pogodowych
  const dane = await getWeather();

  // Elementy do wyboru pory dnia
  const btnsTime = document.querySelectorAll(".godzChooseBtn")
  const timeSpan = document.getElementById("borderTopDisplay")

  // Funkcja zmiany pory dnia
  function selectTime(index) {
    globalIndex2 = index
    if (index == 1) {
      timeSpan.style.width = `calc(${window.getComputedStyle(timeSpan).width} - 4px)`;
      timeSpan.style.left = `calc(((100% / 3) * ${index}) + 2px)`;
      isLessDay2 = true;
    } else {
      if (isLessDay2 == true) {
        timeSpan.style.width = `calc(${window.getComputedStyle(timeSpan).width} + 4px)`;
        isLessDay2 = false;
      }
      timeSpan.style.left = `calc((100% / 3) * ${index})`;
    }
    curWeather = globalIndex1 * 3 + globalIndex2
    displayWeather(curWeather)
  }

  // Obsługa kliknięć w pory dnia
  btnsTime.forEach((elem) => {
    elem.addEventListener("click", () => {
      const index = Number(elem.id.slice(-1) - 1);
      selectTime(index);
    })
  })

  // Wyznaczenie początkowego stanu (wybór pory dnia wg aktualnej godziny)
  selectTime(globalIndex2);

  // Obsługa wyboru dnia
  const btnsWeather = document.querySelectorAll(".buttonWeatherChoose");
  const weatherSpan = document.getElementById("borderBottomDisplay");

  btnsWeather.forEach((elem) => {
    elem.addEventListener("click", () => {
      const index = Number(elem.id.slice(-1) - 1)
      globalIndex1 = index
      if (index == 1) {
        weatherSpan.style.width = `calc(${window.getComputedStyle(weatherSpan).width} - 4px)`;
        weatherSpan.style.left = `calc(((100% / 3) * ${index}) + 2px)`;
        isLessDay1 = true;
      } else {
        if (isLessDay1 == true) {
          weatherSpan.style.width = `calc(${window.getComputedStyle(weatherSpan).width} + 4px)`;
          isLessDay1 = false;
        }
        weatherSpan.style.left = `calc((100% / 3) * ${index})`;
      }
      curWeather = globalIndex1 * 3 + globalIndex2
      displayWeather(curWeather)
    });
  });

  // Wypełnienie nazw dni
  for (let i = 0; i < 3; i++) {
    if (dane[i * 3]) {
      const dayNameSmall = dane[i * 3].data.slice(0, 3)
      const dayName = dayNameSmall.charAt(0).toUpperCase() + dayNameSmall.slice(1)
      btnsWeather[i].innerHTML = `<h1>${dayName}</h1>`
    }
  }
}

<!--Chat bot script-->

<script>
// Historia czatu przesłana do LM Studio z domyślnym promptem systemowym
let chatHistory = [
  {
    role: "system",
    content: "Jesteś pomocnym asystentem AI. Odpowidaj w języku jakim do ciebie mówię, operujesz na linux Feodra. Gadasz z natolatiem, żartuj i pytaj. Używaj emotek. A jeśli chcesz abym mógł cos skopiować to daj to pomiędzy ``` "
  }
];

async function sendChatMessage() {
  const inputEl = document.getElementById("chat-input");
  const userText = inputEl.value.trim();

  // 1. Jeśli pole jest puste, nie wysyłaj wiadomości
  if (!userText) return;

  // 2. Wyzwolenie animacji impulsowej na polu tekstowym
  inputEl.classList.add("sending");
  setTimeout(() => inputEl.classList.remove("sending"), 350);

  // 3. Dodanie wiadomości użytkownika do interfejsu oraz do historii
  appendChatMessage("user", userText);
  chatHistory.push({ role: "user", content: userText });
  inputEl.value = "";

  // 4. Utworzenie tymczasowej wiadomości ładowania ("AI pisze...")
  const loadingId = appendChatMessage("assistant loading", "AI pisze...");

  try {
    // 5. Wysyłanie pełnej historii czatu do LM Studio (localhost:1234)
    const response = await fetch("http://localhost:1234/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "local-model",
        messages: chatHistory,
        temperature: 0.7
      })
    });

    if (!response.ok) {
      throw new Error(`Błąd HTTP: ${response.status}`);
    }

    const data = await response.json();

    if (data.choices && data.choices.length > 0 && data.choices[0].message) {
      const aiReply = data.choices[0].message.content;

      // Zastąpienie stanu ładowania gotową odpowiedzią AI
      updateChatMessage(loadingId, aiReply, "assistant");

      // Zapamiętanie odpowiedzi w historii
      chatHistory.push({ role: "assistant", content: aiReply });
    } else {
      throw new Error("Brak prawidłowej odpowiedzi z modelu.");
    }

  } catch (error) {
    console.error("Błąd ChatBota:", error);

    // Wyświetlenie komunikatu o braku załadowanego modelu lub braku połączenia z serwerem
    updateChatMessage(
      loadingId, 
      "⚠️ Błąd: Brak załadowanego modelu w LM Studio lub brak połączenia z serwerem (localhost:1234)!", 
      "error"
    );

    // Usuwamy ostatnią wiadomość użytkownika z historii, aby nie powodować desynchronizacji konwersacji
    chatHistory.pop();
  }
}

function appendChatMessage(roleClass, text) {
  const messagesEl = document.getElementById("chat-messages");
  const msgDiv = document.createElement("div");
  const msgId = "chat-msg-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);

  msgDiv.id = msgId;
  msgDiv.className = `chat-msg ${roleClass}`;
  
  // Renderowanie ze wsparciem dla bloków kodu
  msgDiv.innerHTML = parseMarkdown(text);

  messagesEl.appendChild(msgDiv);
  
  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 10);

  return msgId;
}

function updateChatMessage(msgId, newText, newRoleClass) {
  const msgDiv = document.getElementById(msgId);
  if (msgDiv) {
    // Renderowanie ze wsparciem dla bloków kodu
    msgDiv.innerHTML = parseMarkdown(newText);
    msgDiv.className = `chat-msg ${newRoleClass}`;
    
    msgDiv.style.animation = 'none';
    msgDiv.offsetHeight; /* trigger reflow */
    msgDiv.style.animation = null;

    const messagesEl = document.getElementById("chat-messages");
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function handleChatKeyDown(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendChatMessage();
  }
}

/* OBSŁUGA OKIENKA MODALNEGO "NOWY CZAT" */
function openNewChatModal() {
  const modal = document.getElementById("chat-modal-overlay");
  if (modal) modal.classList.remove("hidden");
}

function closeNewChatModal() {
  const modal = document.getElementById("chat-modal-overlay");
  if (modal) modal.classList.add("hidden");
}

function confirmNewChat() {
  chatHistory = [
    {
      role: "system",
      content: "Jesteś pomocnym asystentem AI."
    }
  ];
  const messagesEl = document.getElementById("chat-messages");
  messagesEl.innerHTML = "";
  closeNewChatModal();
}

// Funkcja parsująca bloki kodu ``` oraz zwykły tekst
function parseMarkdown(text) {
  if (!text) return "";

  // Bezpieczne konwertowanie znaków HTML (ochrona XSS)
  const escapeHtml = (str) =>
    str.replace(/&/g, "&amp;")
       .replace(/</g, "&lt;")
       .replace(/>/g, "&gt;")
       .replace(/"/g, "&quot;")
       .replace(/'/g, "&#039;");

  // Regex szukający bloków kodu ```język ... ```
  const codeBlockRegex = /```(\w*)\r?\n?([\s\S]*?)```/g;

  let lastIndex = 0;
  let resultHTML = "";
  let match;

  while ((match = codeBlockRegex.exec(text)) !== null) {
    // Tekst przed blokiem kodu
    const textBefore = text.slice(lastIndex, match.index);
    resultHTML += escapeHtml(textBefore).replace(/\n/g, "<br>");

    const lang = match[1] ? escapeHtml(match[1]) : "code";
    const codeText = match[2].trim();

    // Generowanie bloku kodu z nagłówkiem i przyciskiem kopiowania
    resultHTML += `
      <div class="code-block-wrapper">
        <div class="code-header">
          <span class="code-lang">${lang}</span>
          <button class="code-copy-btn" onclick="copyCodeBlock(this)">📋 Kopiuj</button>
        </div>
        <pre><code>${escapeHtml(codeText)}</code></pre>
      </div>
    `;

    lastIndex = match.index + match[0].length;
  }

  // Pozostały tekst po ostatnim bloku kodu
  const textAfter = text.slice(lastIndex);
  resultHTML += escapeHtml(textAfter).replace(/\n/g, "<br>");

  return resultHTML;
}

// Funkcja kopiująca zawartość bloku kodu do schowka
function copyCodeBlock(button) {
  const wrapper = button.closest('.code-block-wrapper');
  const code = wrapper.querySelector('code').innerText;

  navigator.clipboard.writeText(code).then(() => {
    const originalText = button.innerHTML;
    button.innerHTML = "✓ Skopiowano!";
    button.classList.add("copied");

    setTimeout(() => {
      button.innerHTML = originalText;
      button.classList.remove("copied");
    }, 2000);
  }).catch(err => {
    console.error("Błąd kopiowania kodu:", err);
  });
}

</script>

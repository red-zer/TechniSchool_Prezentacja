<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Prezentacja</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="impress">

        <div class="step" data-x="0" data-y="0" data-scale="1">
            <header id="helloOne">
                <div class="animowany-napis">
                    <span>H</span>
                    <span>e</span>
                    <span>j</span>
                </div>
                <p>Jestem Maciek</p>
            </header>
            <div id="helloTwo">
                <h2>Uczeń z pasją do technologii i rozwiązywania problemów</h2><br>
                <h2>Przykładowe zainteresowanie:<br>
                    <h3>-Programowanie</h3>
                </h2>
            </div>
        </div>

        <div class="step" data-x="0" data-y="1500" data-scale="1">
            <header id="tittleTwo">
                <h1>Moje zainteresowania</h1>
            </header>
            <div id="zainteresowania">
                <div class="zainteresowanie">
                    <div class="zainDisplay">
                        <h1>1</h1>
                    </div>
                    <div class="zainInfo" id="zainInfo1">
                        <h2>Programowanie</h2>
                        <div class="zainImgs">
                            <span class="zainImg" style="transform: rotate(35deg);">
                                <img src="assets/ProgramingImg1.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(52deg);">
                                <img src="assets/ProgramingImg2.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(-42deg);">
                                <img src="assets/ProgramingImg3.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(9deg);">
                                <img src="assets/ProgramingImg4.png">
                            </span>
                        </div>
                    </div>
                </div>
                <div class="zainteresowanie">
                    <div class="zainDisplay">
                        <h1>2</h1>
                    </div>
                    <div class="zainInfo" id="zainInfo2">
                        <h2>Drukowanie 3D</h2>
                        <div class="zainImgs">
                            <span class="zainImg" style="transform: rotate(15deg);">
                                <img src="assets/3DImg1.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(42deg);">
                                <img src="assets/3DImg2.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(-25deg);">
                                <img src="assets/3DImg3.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(-7deg);">
                                <img src="assets/3DImg4.png">
                            </span>
                        </div>
                    </div>
                </div>
                <div class="zainteresowanie">
                    <div class="zainDisplay">
                        <h1>3</h1>
                    </div>
                    <div class="zainInfo" id="zainInfo3">
                        <h2>Projektowanie 3D</h2>
                        <div class="zainImgs">
                            <span class="zainImg" style="transform: rotate(35deg);">
                                <img src="assets/3DProjectImg1.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(52deg);">
                                <img src="assets/3DProjectImg2.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(-42deg);">
                                <img src="assets/3DProjectImg3.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(9deg);">
                                <img src="assets/3DProjectImg4.png">
                            </span>
                        </div>
                    </div>
                </div>
                <div class="zainteresowanie">
                    <div class="zainDisplay">
                        <h1>4</h1>
                    </div>
                    <div class="zainInfo" id="zainInfo4">
                        <h2>Microkontrolery</h2>
                        <div class="zainImgs">
                            <span class="zainImg" style="transform: rotate(35deg);">
                                <img src="assets/micorImg1.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(52deg);">
                                <img src="assets/micorImg2.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(-42deg);">
                                <img src="assets/micorImg3.png">
                            </span>
                            <span class="zainImg" style="transform: rotate(9deg);">
                                <img src="assets/microImg4.png">
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="step" data-x="2000" data-y="1500" data-scale="0.1" data-rotate="90">
            <header id="tittleTree">
                <h1>Co drukuję i co projektuję</h1>
            </header>
            <div id="projects3D">
                <div class="projects3D" id="project1">
                    <h1 class="projects3DTittle">1</h1>
                    <div>
                        <img class="projects3DImg" src="assets/slideTreeImg1.jpg">
                    </div>
                </div>
                <div class="projects3D" id="project2">
                    <h1 class="projects3DTittle">2</h1>
                    <div>
                        <img class="projects3DImg" src="assets/powerGlove.png">
                    </div>
                </div>
            </div>
        </div>

        <div class="step" data-x="5000" data-y="1500" data-scale="0.1" data-rotate="1000000">
            <header id="tittleTree">
                <h1>Power glove</h1>
            </header>
            <div id="powerDisplay">
                <img src="assets/powerGlove.png">
            </div>
        </div>

        <div class="step" id="stepFive" data-x="8000" data-y="2000" data-scale="1" data-rotate="1000090">
            <header id="tittleFive">
                <h1>Dziękuję za uwagę</h1>
            </header>
        </div>

        <script src="code.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/impress.js"></script>
        <script>
            impress().init();
        </script>

</body>

</html>
